{% extends 'base.html' %}
{% block title %}Confirm Delete — HomeHQ{% endblock %}
{% block content %}
<div style="max-width:480px;margin:3rem auto;">
  <div class="card-hq" style="border-color:rgba(239,68,68,0.4);">
    <div style="text-align:center;padding:1rem 0;">
      <div style="font-size:2rem;margin-bottom:1rem;">🗑️</div>
      <h2 style="font-size:1.2rem;font-weight:600;margin-bottom:0.5rem;">Confirm Delete</h2>
      <p style="color:var(--text-muted);font-size:0.9rem;">Are you sure you want to delete <strong style="color:var(--text-primary);">{{ obj }}</strong>? This cannot be undone.</p>
      <div style="display:flex;gap:0.75rem;justify-content:center;margin-top:1.5rem;">
        <a href="javascript:history.back()" class="btn-hq-secondary text-decoration-none">Cancel</a>
        <form method="post" style="margin:0;">
          {% csrf_token %}
          <button type="submit" class="btn-hq-danger" style="padding:0.45rem 1rem;">Delete</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
